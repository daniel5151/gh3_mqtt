[package]
name = "gh3_mqtt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = ["Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Foundation"] }
zerocopy = { version = "0.8.62", features = ["derive"] }
